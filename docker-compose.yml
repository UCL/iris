volumes: {
  dataset: {}
}

services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./project:/project
    ports:
      - "5000:5000"
    command: >
      label /project/config.json -p
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - iris

